<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D&amp;D 自動角色卡</title>
<style>
/* 桌面上攤著三張 Letter 紙：上方工具列，下方是可直接填寫的角色卡 */
:root {
  --desk: #e6e3dc;
  --bar: #2b2622;
  --bar-fg: #f3eee6;
  --bar-muted: #b9afa3;
  --accent: #a3322a;
  --ink: #111;
  --focus: rgba(46, 104, 196, .13);
  --hover: rgba(46, 104, 196, .07);
  /* 手機表單 */
  --card: #faf8f4;
  --fg: #221e1b;
  --muted: #6f655c;
  --line: #dcd5ca;
  --field: #fff;
  --head: #8c2a23;
  --chip: #f1ece4;
  --val-font: "Microsoft YaHei", "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
  --ui-font: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --desk: #1d1b19; --bar: #0f0e0d; --bar-muted: #8f877e;
    --card: #262320; --fg: #ece6dd; --muted: #a39a90; --line: #3d3833; --field: #1d1b19; --head: #e39a8f; --chip: #302c28; color-scheme: dark; }
}
:root[data-theme="dark"] { --desk: #1d1b19; --bar: #0f0e0d; --bar-muted: #8f877e;
  --card: #262320; --fg: #ece6dd; --muted: #a39a90; --line: #3d3833; --field: #1d1b19; --head: #e39a8f; --chip: #302c28; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--desk); font-family: var(--ui-font); color: var(--bar-fg); }

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 21; background: var(--bar); }
#bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bar);
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
  box-shadow: 0 2px 10px rgba(0,0,0,.25);
}
#bar h1 { font-size: 15px; margin: 0; font-weight: 700; letter-spacing: .04em; }
#bar .status { font-size: 12px; color: var(--bar-muted); min-width: 7em; }
#bar .grow { flex: 1; }
#bar .group { display: flex; flex-wrap: wrap; gap: 6px; }
#bar button, #bar label.btn {
  font: inherit; font-size: 13px; color: var(--bar-fg); background: transparent;
  border: 1px solid #5a514a; border-radius: 6px; padding: 6px 11px; cursor: pointer; white-space: nowrap;
}
#bar button:hover, #bar label.btn:hover { background: #3a332e; }
#bar button.primary { background: var(--accent); border-color: var(--accent); font-weight: 700; }
#bar button.primary:hover { background: #8c2a23; }
#bar button:disabled { opacity: .6; cursor: wait; }
#bar button:focus-visible, #bar label.btn:focus-within { outline: 2px solid #e9b44c; outline-offset: 2px; }
#bar input[type=file] { display: none; }
#bar #tools3:not(.on) { display: none; }
#more { position: relative; }
#more > summary {
  list-style: none; font-size: 13px; color: var(--bar-fg); border: 1px solid #5a514a; border-radius: 6px;
  padding: 6px 11px; cursor: pointer; white-space: nowrap;
}
#more > summary::-webkit-details-marker { display: none; }
#more .menu { display: flex; flex-wrap: wrap; gap: 6px; }
@media (min-width: 760px) { #more > summary { display: none; } }
@media (max-width: 759px) {
  #bar { gap: 8px; }
  #bar h1 { font-size: 14px; }
  #bar .status, #bar #tools3 { display: none; }
  #more .menu {
    position: absolute; left: 0; top: calc(100% + 6px); z-index: 22; flex-direction: column; min-width: 10em;
    background: var(--bar); padding: 8px; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.35);
  }
  #more .menu button, #more .menu label.btn { text-align: left; font-size: 14px; padding: 9px 12px; }
}

/* 手機填寫模式：同一份資料，改成直式表單 */
#form {
  display: none; max-width: 720px; margin: 0 auto; color: var(--fg);
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) 72px max(16px, env(safe-area-inset-left, 0px));
}
body.view-form #form { display: flex; flex-direction: column; gap: 14px; }
body.view-form #desk { display: none; }
.sec { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.sec h2 { margin: 0; font-size: 15px; letter-spacing: .06em; color: var(--head); }
.hint { margin: -6px 0 0; font-size: 12px; color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.fl { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.fl.wide { grid-column: 1 / -1; }
.fl > span { font-size: 12px; color: var(--muted); }
.mi {
  font-family: var(--val-font); font-size: 16px; color: var(--fg); background: var(--field);
  border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; width: 100%; min-width: 0; margin: 0;
}
textarea.mi { resize: vertical; min-height: 64px; line-height: 1.55; display: block; }
.mi:focus { outline: 2px solid var(--head); outline-offset: -1px; }
.mi.big { font-size: 22px; font-weight: 700; text-align: center; padding: 5px 4px; }
.mi.num { text-align: center; width: 64px; flex: none; padding: 7px 4px; }
.abl { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.ab { border: 1px solid var(--line); border-radius: 10px; padding: 10px 8px; display: flex; flex-direction: column; gap: 6px; text-align: center; min-width: 0; }
.ab b { font-size: 14px; }
.ab .sc { display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: var(--muted); }
.ab .sc .mi { text-align: center; padding: 6px 2px; }
.list { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); }
.list .row:first-child { border-top: 0; }
.row .nm { flex: 1; min-width: 0; font-size: 15px; }
.row .nm small { color: var(--muted); font-size: 12px; margin-left: 6px; }
.row.sp { border-top: 0; padding: 2px 0; }
.row.sp .mi { flex: 1; padding: 7px 10px; }
.tog {
  flex: none; width: 26px; height: 26px; padding: 0; border-radius: 50%; cursor: pointer;
  border: 2px solid var(--fg); background: transparent;
}
.tog[aria-pressed="true"] { background: var(--fg); box-shadow: inset 0 0 0 3px var(--card); }
.tog:focus-visible { outline: 2px solid var(--head); outline-offset: 2px; }
.ds { display: flex; flex-direction: column; gap: 8px; padding-top: 4px; }
.ds > span { font-size: 12px; color: var(--muted); }
.dsrow { display: flex; align-items: center; gap: 12px; }
.dsrow em { font-style: normal; width: 3em; font-size: 14px; }
.coins { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.coins .mi { width: 100%; }
details.lv { border-top: 1px solid var(--line); }
details.lv:first-child { border-top: 0; }
details.lv > summary { list-style: none; cursor: pointer; padding: 10px 2px; display: flex; align-items: baseline; gap: 8px; }
details.lv > summary::-webkit-details-marker { display: none; }
details.lv > summary::before { content: "▸"; color: var(--muted); width: 1em; }
details.lv[open] > summary::before { content: "▾"; }
details.lv > summary small { color: var(--muted); }
.lvb { display: flex; flex-direction: column; gap: 4px; padding: 0 0 12px; }
.lvb .grid { margin-bottom: 6px; }
.ntools { display: flex; gap: 8px; }
.ntools button {
  font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--line); background: var(--field); color: var(--fg);
}
.notesm {
  font-family: var(--val-font); color: var(--fg); background: var(--field); border: 1px solid var(--line);
  border-radius: 8px; padding: 10px 12px; min-height: 200px; outline: none;
}
.notesm:focus { outline: 2px solid var(--head); outline-offset: -1px; }
.notesm p { margin: 0; font-size: 15px; line-height: 1.65; }
.notesm h3 { margin: 8px 0 2px; font-size: 17px; }
@media (max-width: 360px) {
  .abl, .grid.three { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
#busy {
  position: fixed; inset: 0; z-index: 25; display: grid; place-items: center;
  background: var(--desk); color: var(--fg); font-size: 15px;
}
#busy[hidden] { display: none; }

/* 自動填寫版 */
[hidden] { display: none !important; }
.f.auto { cursor: default; }
.f.auto:hover, .f.auto:focus { background: transparent; box-shadow: none; }
.dot[data-auto] { cursor: default; }
.dot[data-auto]:hover { box-shadow: none; }
.dv { font-family: var(--val-font); font-size: 17px; font-weight: 700; padding: 8px 10px; border-radius: 8px;
  background: var(--chip); border: 1px solid transparent; min-height: 40px; font-variant-numeric: tabular-nums; }
.bigv { font-family: var(--val-font); font-size: 26px; font-weight: 700; line-height: 1.1; }
.ab .sub { font-size: 12px; color: var(--muted); }
.numv { width: 56px; text-align: center; font-family: var(--val-font); font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
.row .nm .tag { font-style: normal; font-size: 11px; color: var(--head); margin-left: 6px; }
.tog.ro { cursor: default; display: inline-block; }
.tog[data-s="2"] { box-shadow: inset 0 0 0 3px var(--card), 0 0 0 3px var(--head); }
.pv { white-space: pre-wrap; font-family: var(--val-font); font-size: 14px; line-height: 1.6; padding: 10px 12px;
  border-radius: 8px; background: var(--chip); color: var(--fg); }
.tg { flex-direction: row; align-items: center; gap: 10px; font-size: 14px; }
.btn2 { font: inherit; font-size: 14px; padding: 9px 12px; border-radius: 8px; cursor: pointer; align-self: flex-start;
  border: 1px solid var(--line); background: var(--field); color: var(--fg); }
.btn2:hover { border-color: var(--head); }
select.mi { appearance: auto; }
.cgs { display: flex; flex-direction: column; gap: 8px; }
.cgt { margin: 0; font-size: 13px; line-height: 1.5; }
.cgt .need { color: var(--head); font-weight: 700; }
.cgt .done { color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }
.chip { font: inherit; font-size: 14px; padding: 6px 12px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--line); background: var(--field); color: var(--fg); }
.chip[aria-pressed="true"] { background: var(--head); border-color: var(--head); color: var(--card); font-weight: 700; }
.chip:disabled { opacity: .45; cursor: default; }
.chip:focus-visible { outline: 2px solid var(--head); outline-offset: 2px; }
/* 第 2 頁右欄：排版比照第 3 頁法術說明 */
#spbox { position: absolute; overflow: hidden; color: #111; font-family: var(--val-font); --s: 1; }
#spbox h4 { margin: calc(5pt * var(--s)) 0 calc(1.5pt * var(--s)); font-size: calc(9pt * var(--s)); font-weight: 700;
  border-bottom: .6pt solid #777; padding-bottom: 1pt; }
#spbox h4:first-child { margin-top: 0; }
#spbox h3 { margin: calc(5pt * var(--s)) 0 0; font-size: calc(10.5pt * var(--s)); font-weight: normal; line-height: 1.35; }
#spbox p { margin: 0; font-size: calc(8.3pt * var(--s)); line-height: 1.5; }
#spbox p.meta { color: #555; font-size: calc(7.3pt * var(--s)); }
/* 法術選單 */
.spin { flex: 1; display: flex; gap: 6px; min-width: 0; }
.spin .mi { flex: 1; }
.pick { flex: none; font: inherit; font-size: 13px; padding: 0 12px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--line); background: var(--chip); color: var(--fg); }
.pick:hover { border-color: var(--head); }
#picker { width: min(640px, calc(100vw - 16px)); max-height: 86vh; padding: 0; border: 0; border-radius: 12px;
  background: var(--card); color: var(--fg); font-family: var(--ui-font); box-shadow: 0 12px 48px rgba(0,0,0,.45); }
#picker[open] { display: flex; flex-direction: column; }
#picker::backdrop { background: rgba(0,0,0,.5); }
#picker > * { margin-left: 14px; margin-right: 14px; }
.pk-head { display: flex; justify-content: space-between; align-items: center; padding-top: 12px; font-size: 16px; }
.pk-head button, .pk-use { font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--line); background: var(--field); color: var(--fg); }
#picker #pkSearch { margin-top: 10px; width: auto; }
.pk-all { display: flex; align-items: center; gap: 6px; font-size: 13px; margin-top: 8px; }
.pk-all small { color: var(--muted); }
#picker .hint { margin: 6px 14px 4px; }
#pkList { overflow-y: auto; padding-bottom: 14px; display: flex; flex-direction: column; }
.pk-item { border-top: 1px solid var(--line); padding: 9px 0; }
.pk-top { display: flex; align-items: flex-start; gap: 8px; }
.pk-name { flex: 1; text-align: left; font: inherit; background: none; border: 0; color: var(--fg); cursor: pointer; padding: 0;
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; }
.pk-name b { font-size: 15px; }
.pk-tags { font-size: 12px; color: var(--head); }
.pk-use { flex: none; background: var(--head); border-color: var(--head); color: var(--card); font-weight: 700; }
.pk-sum { margin: 4px 0 0; font-size: 13px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pk-more p { margin: 4px 0 0; font-size: 13.5px; line-height: 1.6; }
.pk-more p.meta { color: var(--muted); font-size: 12px; }
.pv.rich { white-space: normal; }
.pv.rich h4 { margin: 10px 0 2px; font-size: 14px; color: var(--head); }
.pv.rich h4:first-child { margin-top: 0; }
.pv.rich h3 { margin: 8px 0 0; font-size: 15px; }
.pv.rich p { margin: 0; }
.pv.rich p.meta { color: var(--muted); font-size: 12px; }
@media (min-width: 1280px) {
  #app { display: grid; grid-template-columns: 470px minmax(0, 1fr); align-items: start; }
  #app #form { display: flex; flex-direction: column; gap: 14px; position: sticky; top: 52px;
    max-height: calc(100vh - 52px); overflow-y: auto; padding: 16px 8px 40px 16px; }
  body.view-form #desk, #desk { display: block; }
  #bView { display: none; }
}

#desk { padding: 24px max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px)); overflow-x: hidden; }
#sheets { width: 612pt; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }

.page {
  position: relative; width: 612pt; height: 792pt; background: #fff no-repeat 0 0 / 100% 100%;
  box-shadow: 0 1px 3px rgba(0,0,0,.18), 0 8px 24px rgba(0,0,0,.12); color: var(--ink);
}
.f {
  position: absolute; margin: 0; border: 0; border-radius: 2px; background: transparent; color: var(--ink);
  font-family: var(--val-font); padding: 0 2pt; outline: none; line-height: normal;
}
textarea.f { resize: none; padding: 1pt 2pt; overflow: hidden; white-space: pre-wrap; word-break: break-word; }
.f:hover { background: var(--hover); }
.f:focus { background: var(--focus); box-shadow: 0 0 0 1px rgba(46,104,196,.45); }
.dot {
  position: absolute; padding: 0; border: 0; border-radius: 50%; background: transparent; cursor: pointer;
}
.dot:hover { box-shadow: 0 0 0 2px rgba(46,104,196,.45); }
.dot:focus-visible { outline: 2px solid #2e68c4; outline-offset: 1px; }
.dot[aria-pressed="true"] { background: var(--ink); }

/* 第 3 頁：法術說明，可自由增長，下載時自動分頁 */
.page.flow { height: auto; min-height: 792pt; padding: 30pt 36pt 36pt 27pt; }
#notes { outline: none; font-family: var(--val-font); color: var(--ink); min-height: 720pt; }
#notes p { margin: 0; font-size: 10pt; line-height: 17.1pt; }
#notes h3 { margin: 0; font-size: 12pt; line-height: 20.5pt; font-weight: normal; }
#notes:focus { box-shadow: 0 0 0 1px rgba(46,104,196,.25); }

.exporting .f { background: transparent !important; box-shadow: none !important; }
.exporting .dot { box-shadow: none !important; outline: none !important; }
.fx { position: absolute; color: #111; font-family: var(--val-font); overflow: hidden; padding: 0 2pt; }

#ask { border: 0; border-radius: 10px; padding: 18px 20px; max-width: min(360px, calc(100vw - 32px));
  background: var(--bar); color: var(--bar-fg); font-family: var(--ui-font); box-shadow: 0 10px 40px rgba(0,0,0,.4); }
#ask::backdrop { background: rgba(0,0,0,.45); }
#ask p { margin: 0 0 16px; font-size: 14px; line-height: 1.6; }
#ask .row { display: flex; justify-content: flex-end; gap: 8px; }
#ask button { font: inherit; font-size: 13px; padding: 6px 14px; border-radius: 6px; cursor: pointer;
  border: 1px solid #5a514a; background: transparent; color: var(--bar-fg); }
#ask button.ok { background: var(--accent); border-color: var(--accent); font-weight: 700; }
#toast {
  position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--bar); color: var(--bar-fg); padding: 9px 16px; border-radius: 8px; font-size: 13px;
  box-shadow: 0 4px 16px rgba(0,0,0,.3); opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 30;
}
#toast.show { opacity: 1; }
@media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
@media print {
  #bar, #toast { display: none; }
  #desk { padding: 0; } #sheets { gap: 0; zoom: 1 !important; }
  .page { box-shadow: none; break-after: page; }
  @page { size: letter; margin: 0; }
}
</style>
</head>
<body>
<div id="bar">
  <h1>D&amp;D 角色卡・自動填寫</h1>
  <span class="status" id="status">已自動儲存</span>
  <span class="grow"></span>
  <div class="group" id="tools3">
    <button type="button" id="bH" title="把游標所在的段落設成法術名稱（12pt）">設為標題</button>
    <button type="button" id="bP" title="把游標所在的段落設成內文（10pt）">設為內文</button>
  </div>
  <div class="group">
    <details id="more"><summary>更多</summary><div class="menu">
      <button type="button" id="bReset">還原原始內容</button>
      <button type="button" id="bClear">清空全部</button>
      <button type="button" id="bExport">匯出存檔</button>
      <label class="btn" for="fImport">匯入存檔<input type="file" id="fImport" accept=".json,application/json"></label>
    </div></details>
    <button type="button" id="bView">表單模式</button>
    <button type="button" class="primary" id="bPdf">下載 PDF</button>
  </div>
</div>
<div id="busy" hidden>正在產生 PDF…</div>
<div id="app">
<div id="form"></div>

const NOTES_DEFAULT = "<h3>魔法 0 環-</h3><p><br></p><h3>翠炎劍（半徑 5 英尺）</h3><p>你揮舞著施法時使用的武器，並用它對你周圍 5 英尺內的一個生物進行近戰攻擊。若命中，目標受到該攻擊的正常影響，且翠綠色的火焰將從目標身上跳到另一個你所選擇的，位於 5 呎內你所能看見的生物。第二個生物將受到等同你施法屬性調整值的火焰傷害。</p><p>此法術的傷害將隨著你的等級越高而增加。在 5 級的時候，近戰攻擊將對目標造成額外的 1d8 火焰傷害，且對第二個生物造成的傷害將提升至 1d8+你的施法屬性調整值。這兩個傷害骰都將在 11 級和 17 級時各增加 1d8。</p><p><br></p><h3>克敵先制（30 呎）</h3><p>你伸出你的手並指向射程內的一個目標。你的魔法讓得以短暫理解該目標的防禦弱點。在你的下個回合，只要此法術尚未結束，你對該目標進行的第一次攻擊檢定獲得優勢。（至多一輪）</p><p><br></p><h3>魔法伎倆（10 呎）</h3><p>這個法術是新手施法者用來練習的小小魔法把戲。你在射程內創造出下列其中一種魔法效果：</p><p>你創造出一個即效、無害的感官效果，像是一陣火花飛濺、一陣微風、模糊的音符、或一陣怪味。</p><p>你立刻點亮或熄滅一根蠟燭、火炬、或一處小型篝火。</p><p>你立刻清潔或弄髒一個不大於 1 呎立方的物體。</p><p>你將一個最大 1 呎立方的無生命材料冷卻、溫熱、或調味長達 1 小時。</p><p>你讓一片顏色、一個小記號、或一個符號出現在物體或一處表面上長達 1 小時。</p><p>你創造出一個非魔法的小飾物或一個能放入你手中的幻影，並持續直到你的下個回合結束。</p><p>如果你多次施放這個法術，你可以讓最多三個非即效的效果同時生效，且你可以用一個動作解消像這樣的一個效果。</p><h3><br></h3><h3>魔能爆（120 呎）</h3><p>一束純粹的爆裂能量射向目標。進行一次遠程法術攻擊。若命中，目標受到 1d10 點力場傷害。當你等級提升時（5、11、17 級），此法術能同時發射更多發射線。</p><h3><br></h3><h3>魔法 1 環-</h3><p><br></p><h3>防護善惡（觸碰）</h3><p>（專注，至多 10 分鐘）直到法術結束前，一個你觸碰的自願生物在對抗特定類型的生物時受到保護：天界、異怪、元素、精類、邪魔、和不死生物。</p><p>這項保護提供了數個好處：這些類別的生物在對目標進行的攻擊檢定具有劣勢。目標也不會被它們魅惑、恐懼、或附身。如果目標已經被這類生物魅惑、恐懼、或附身，則目標將在之後任何對抗相關效果的豁免檢定中具有優勢。</p><p><br></p><h3>造成恐懼（60 呎）</h3><p>（專注，至多 1 分鐘）你喚醒了射程內你能看見的一個生物對死亡的意識。構裝生物或不死生物免疫這個效果。目標必須成功通過一次睿知豁免，否則將在法術結束前恐懼於你。被恐懼的目標可以在它的每個回合結束時重復進行這個豁免檢定，若成功將結束這個法術對它自己的效果。</p>";

function fit(el, f) {

const downloadsP = window.claude && window.claude.use ? window.claude.use('downloads').catch(() => null) : Promise.resolve(null);
async function saveBlob(blob, name) {
  const dl = await downloadsP;
  if (dl) {
    try { await dl.save({ filename: name, data: blob }); return true; }
    catch (e) { if (!e || e.code !== 'declined') toast('無法下載：' + ((e && e.message) || '請稍後再試')); return false; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  return true;
}

// ---------- 下載 PDF ----------
async function snap(el, opts = {}) {
  return html2canvas(el, Object.assign({
    scale: 3, backgroundColor: '#ffffff', useCORS: true, logging: false,
    scrollX: 0, scrollY: 0, windowWidth: Math.max(document.documentElement.clientWidth, 1000),
    onclone: doc => {
      doc.getElementById('sheets').style.zoom = '';
      doc.getElementById('desk').style.overflow = 'visible';
      // 輸入框換成一般文字，確保 PDF 換行、位置和畫面一致
      doc.querySelectorAll('.f').forEach(c => {
        const orig = document.getElementById(c.id);
        const d = doc.createElement('div');
        d.className = 'fx';
        const cs = getComputedStyle(orig);
        Object.assign(d.style, {
          left: orig.style.left, top: orig.style.top, width: orig.style.width, height: orig.style.height,
          fontSize: cs.fontSize, fontWeight: cs.fontWeight, lineHeight: cs.lineHeight, textAlign: cs.textAlign,
          padding: cs.padding,
        });
        if (orig.tagName === 'TEXTAREA') {
          Object.assign(d.style, { whiteSpace: 'pre-wrap', wordBreak: 'break-word' });
        } else {
          Object.assign(d.style, { whiteSpace: 'pre', display: 'flex', alignItems: 'center',
            justifyContent: { center: 'center', right: 'flex-end' }[cs.textAlign] || 'flex-start' });
        }
        d.textContent = orig.value;
        c.replaceWith(d);
      });
      const n = doc.getElementById('notes'); if (n) n.style.boxShadow = 'none';
    },
  }, opts));
}

$('#bPdf').addEventListener('click', async () => {
  const btn = $('#bPdf');
  if (!window.html2canvas || !window.jspdf) { toast('PDF 元件載入失敗，請確認網路連線後重新整理'); return; }
  btn.disabled = true; btn.textContent = '產生中…';
  const sx = window.scrollX, sy = window.scrollY;
  // 表單模式下先暫時換回紙本（用遮罩蓋住），輸出完再切回來
  const wasForm = document.body.classList.contains('view-form');
  $('#busy').hidden = false;
  document.body.classList.remove('view-form');
  document.body.classList.add('exporting');
  const zoom = $('#sheets').style.zoom;
  $('#sheets').style.zoom = '';
  fitAll();
  window.scrollTo(0, 0);
  try {
    const pdf = new jspdf.jsPDF({ unit: 'pt', format: 'letter', compress: true });
    const W = 612, H = 792;
    for (const id of ['page1', 'page2']) {
      const c = await snap(document.getElementById(id));
      if (id !== 'page1') pdf.addPage();
      pdf.addImage(c.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, W, H);
    }
    // 第 3 頁：依段落切成多頁
    const p3 = document.getElementById('page3');
    const c3 = await snap(p3);
    const pxPerPt = p3.getBoundingClientRect().width / W;      // CSS px per pt
    const k = c3.width / p3.getBoundingClientRect().width;    // canvas px per CSS px
    const top = 30 * pxPerPt, bottom = 36 * pxPerPt, usable = H * pxPerPt - top - bottom;
    const p3top = p3.getBoundingClientRect().top;
    const blocks = [...notes.children].map(el => { const r = el.getBoundingClientRect(); return { t: r.top - p3top, b: r.bottom - p3top }; });
    const end = blocks.length ? blocks[blocks.length - 1].b : top;
    const cuts = []; let start = top;
    for (const bl of blocks) if (bl.b - start > usable && bl.t > start) { cuts.push([start, bl.t]); start = bl.t; }
    cuts.push([start, Math.max(end, start + 1)]);
    for (const [a, b] of cuts) {
      const pc = document.createElement('canvas');
      pc.width = Math.round(W * pxPerPt * k); pc.height = Math.round(H * pxPerPt * k);
      const ctx = pc.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, pc.width, pc.height);
      const h = Math.min(b - a, usable + bottom);
      ctx.drawImage(c3, 0, a * k, c3.width, h * k, 0, top * k, c3.width, h * k);
      pdf.addPage();
      pdf.addImage(pc.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, W, H);
    }
    restore();
    if (await saveBlob(pdf.output('blob'), fileBase() + '.pdf')) toast('PDF 已下載');
  } catch (err) {
    console.error(err); toast('PDF 產生失敗：' + err.message);
  } finally {
    restore();
    btn.disabled = false; btn.textContent = '下載 PDF';
  }
  function restore() {
    if ($('#busy').hidden) return;
    $('#sheets').style.zoom = zoom;
    document.body.classList.remove('exporting');
    if (wasForm) document.body.classList.add('view-form');
    $('#busy').hidden = true;
    window.scrollTo(sx, sy);
  }
});

function h(tag, props = {}, ...kids) {
  const e = document.createElement(tag);

    if (k === 'class') e.className = v; else if (k === 'text') e.textContent = v; else e.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null) e.append(c);

}
function grow(t) { t.style.height = 'auto'; t.style.height = Math.max(t.scrollHeight + 2, 64) + 'px'; }

function ctl(k, o = {}) {
  const f = byKey[k];
  let e;
  if (f.t === 'c') {
    e = h('button', { type: 'button', class: 'tog', 'aria-pressed': 'false', 'aria-label': o.label || '勾選' });
    e.addEventListener('click', () => {
      const v = e.getAttribute('aria-pressed') !== 'true';
      e.setAttribute('aria-pressed', String(v)); setVal(f, v); changed();
    });
  } else {
    e = h(f.t === 't' ? 'textarea' : 'input', { class: 'mi' + (o.cls ? ' ' + o.cls : ''), autocomplete: 'off', spellcheck: 'false' });
    if (f.t === 'i') e.type = 'text';
    if (o.label) e.setAttribute('aria-label', o.label);
    if (o.ph) e.placeholder = o.ph;
    e.addEventListener('input', () => {
      setVal(f, e.value); changed();

  }

}

   "text": [

function spellTags(s) {

  if (dmg) tags.push(`${dmg[1]} ${dmg[2]}`);
  else if (/恢復/.test(all) && /(\d+d\d+)/.test(all)) tags.push('治療 ' + all.match(/(\d+d\d+)/)[1]);
  const range = (s.meta.match(/射程：(.+?)(?=\s+成分|$)/) || [])[1];
  if (range) tags.push(range.trim());
  const time = (s.meta.match(/施法時間：(\S+?)(?:，|\s|$)/) || [])[1];
  if (time) tags.push(time);
  if (/持續時間：專注/.test(s.meta)) tags.push('專注');
  return tags;

// 計算結果（給表單顯示用）
let C = {};
function compute() {
  const c = R.classes[cfg.cls] || null;
  const lvl = Math.min(20, Math.max(1, num(cfg.level) || 1));
  const row = c ? c.levels[lvl - 1] : null;
  const pb = row ? row.pb : Math.ceil(lvl / 4) + 1;
  const sp = R.species[cfg.species] || null;
  const opt = sp && sp.opt ? (sp.opt.choices.find(x => x[0] === cfg.spOpt) || null) : null;
  const bg = R.backgrounds[cfg.bg] || null;
  const feat = bg ? bg.feat : '';

  // 屬性值：基礎值＋背景加值（不超過 20）＋其他加值
  const bonus = asiBonus(bg, cfg.asi);
  const score = {}, mod = {};
  for (const [k] of AB) {
    const base = num(cfg.base[k]);
    if (base == null) { score[k] = null; mod[k] = 0; continue; }
    score[k] = Math.min(20, Math.max(base, base + (bonus[k] || 0))) + (num(cfg.other[k]) || 0);
    mod[k] = Math.floor((score[k] - 10) / 2);
  }
  const has = k => score[k] != null;

  // 豁免與技能
  const saveProf = new Set(c ? c.saves : []);
  const bgSkills = new Set(bg ? bg.skills : []);
  const groups = skillGroups(c, feat);
  const skillSrc = {};
  for (const k of bgSkills) skillSrc[k] = '背景';
  for (const g of groups) {
    const picks = (cfg.picks[g.key] || []).filter(k => g.pool.includes(k) && !skillSrc[k]).slice(0, g.n);
    for (const k of picks) skillSrc[k] = g.src;
    g.picked = picks;
  }
  const jack = cfg.cls === 'bard' && lvl >= 2 ? Math.floor(pb / 2) : 0;
  const skillLv = {}, skillVal = {};
  for (const [k, , a] of SKA) {
    skillLv[k] = Math.max(skillSrc[k] ? 1 : 0, num(cfg.skills[k]) || 0);
    skillVal[k] = mod[a] + skillLv[k] * pb + (skillLv[k] ? 0 : jack);
  }

  // 護甲等級、速度、先攻、生命值
  const armor = R.armor.find(a => a.n === cfg.armor) || null;
  let ac;
  if (armor) ac = armor.base + (armor.dexMax == null ? mod.dex : Math.min(mod.dex, armor.dexMax));
  else if (cfg.cls === 'barbarian') ac = 10 + mod.dex + mod.con;
  else if (cfg.cls === 'monk' && !cfg.shield) ac = 10 + mod.dex + mod.wis;
  else ac = 10 + mod.dex;
  if (cfg.shield) ac += 2;
  let speed = sp ? sp.speed : 30;
  if (cfg.species === '精靈' && cfg.spOpt === '木精靈') speed = 35;
  if (cfg.cls === 'monk' && !armor && !cfg.shield) speed += num(row.x['無甲移動']) || 0;
  if (cfg.cls === 'barbarian' && lvl >= 5 && !(armor && armor.kind === 'heavy')) speed += 10;
  const init = mod.dex + (feat === '警覺' ? pb : 0) + jack;
  let hp = null;
  if (c && has('con')) {
    hp = c.hd + mod.con;
    for (let i = 2; i <= lvl; i++) hp += Math.max(1, c.hd / 2 + 1 + mod.con);
    hp = Math.max(1, hp) + (sp ? sp.hpPerLevel * lvl : 0) + (feat === '健壯' ? 2 * lvl : 0);
  }
  const dv = cfg.species === '精靈' && cfg.spOpt === '卓爾' ? 120 : (sp ? sp.dv : 0);

  // 武器攻擊
  const atkLines = [];
  for (const wn of cfg.weapons) {
    const w = R.weapons.find(x => x.n === wn);
    if (!w) continue;
    const a = w.range === 'ranged' ? 'dex' : (w.finesse ? (mod.dex > mod.str ? 'dex' : 'str') : 'str');
    const hit = mod[a] + (weaponProficient(c, w) ? pb : 0);
    const dmg = w.dice + (mod[a] ? fmt(mod[a]) : '');
    atkLines.push(`${w.n}　${fmt(hit)}　${dmg} ${w.type}${w.versatile ? `（雙手 ${w.versatile}${mod[a] ? fmt(mod[a]) : ''}）` : ''}`);
  }
  if (cfg.atkNote) atkLines.push(cfg.atkNote);

  // 特性（物種、背景專長、職業）；第 2 頁右欄只放數值和種族法術
  const fill = s => s.replace('{8+pb+con}', 8 + pb + mod.con).replace('{breath}', breathDice(lvl))
    .replace(/\{dmg\}/g, opt ? opt[1] : '（選擇血統）').replace('{dv}', dv)
    .replace('{opt}', opt ? opt[0] : '（未選擇）').replace('{optDesc}', opt ? opt[1] : '');
  const F = [];
  if (sp) {
    F.push(`【${cfg.species}${opt ? '・' + opt[0] : ''}】${sp.size}・速度 ${speed} 尺${dv ? `・黑暗視覺 ${dv} 尺` : ''}`);
    for (const [n, d, gate] of sp.traits) {
      if (n === '黑暗視覺') continue;
      F.push(`${n}${gate && lvl < gate ? `（${gate} 級）` : ''}：${fill(d)}`);
    }
    if (opt && !sp.traits.some(t => t[1].includes('{opt}') || t[1].includes('{dmg}'))) F.push(`${sp.opt.label}・${opt[0]}：${opt[1]}`);
  }
  if (bg) F.push(`【背景・${cfg.bg}】${feat}：${R.feats[feat] || ''}`);
  if (c) {
    F.push(`【${c.name} ${lvl} 級】`);
    for (let i = 0; i < lvl; i++) if (c.levels[i].f) F.push(`${i + 1} 級：${c.levels[i].f}`);
    const ex = Object.entries(row.x).map(([k, v]) => `${k} ${v}`);
    if (row.cantrips) ex.push(`戲法 ${row.cantrips}`);
    if (row.prepared) ex.push(`準備法術 ${row.prepared}`);
    if (row.pact) ex.push(`契約法術位 ${row.pact} 個（${row.pactLv} 環）`);
    if (ex.length) F.push(ex.join('・'));
  }
  if (cfg.featNote) F.push(cfg.featNote);

  // 熟練項與語言
  // 語言：通用語＋物種語言（自動）＋自選
  const langs = ['通用語', sp && sp.lang ? sp.lang : cfg.langs[0], cfg.langs[1]].filter(Boolean);
  const P = [];
  if (c) P.push(`護甲：${c.armorText}`, `武器：${c.weapons}`);
  const tools = [...new Set([bg && bg.tool, c && c.tools].filter(Boolean))];
  if (tools.length) P.push(`工具：${tools.join('、')}`);
  P.push(`語言：${[...new Set(langs)].join('、')}`);
  if (cfg.profNote) P.push(cfg.profNote);

  // 施法
  const castAb = c && c.cast;
  const slots = row ? (row.slots || (row.pact ? Array.from({ length: 9 }, (_, i) => (i + 1 === row.pactLv ? row.pact : 0)) : [])) : [];

  // ---- 寫進紙本 ----
  const put = (k, v) => { if (byKey[k]) setVal(byKey[k], v ?? ''); };
  const spDetail = speciesPanel(sp, opt, pb, mod, lvl, speed, dv);
  const box = document.getElementById('spbox');
  if (box) { box.innerHTML = spDetail; fitSp(); }
  put('class_level', c ? `${c.name} ${lvl}` : '');
  put('race', cfg.species);
  put('background', cfg.bg);
  put('alignment', cfg.align);
  put('prof', fmt(pb));
  for (const [k] of AB) {
    put(k + '_score', has(k) ? score[k] : '');
    put(k + '_mod', has(k) ? fmt(mod[k]) : '');
    put('save_' + k, has(k) ? fmt(mod[k] + (saveProf.has(k) ? pb : 0)) : '');
    put('save_' + k + '_p', saveProf.has(k));
  }
  for (const [k, , a] of SKA) {
    put('skill_' + k, has(a) ? fmt(skillVal[k]) : '');
    put('skill_' + k + '_p', skillLv[k] > 0);
  }
  put('passive', has('wis') ? 10 + skillVal.perception : '');
  put('ac', has('dex') ? ac : '');
  put('init', has('dex') ? fmt(init) : '');
  put('speed', `${speed} 尺`);
  put('hp_max', hp ?? '');
  put('hd_total', c ? `${lvl}d${c.hd}` : '');
  put('attacks', atkLines.join('\n'));
  put('features', F.join('\n'));
  put('profs', P.join('\n'));
  put('spell_class', castAb ? c.name : '');
  put('spell_ability', castAb ? ABN[castAb] : '');
  put('spell_dc', castAb ? `DC${8 + pb + mod[castAb]}` : '');
  put('spell_atk', castAb ? fmt(pb + mod[castAb]) : '');
  for (let i = 1; i <= 9; i++) put('slots' + i + '_total', slots[i - 1] || '');

  C = { c, lvl, row, pb, sp, opt, bg, feat, bonus, score, mod, saveProf, bgSkills, skillLv, skillVal, ac, speed, init, hp,
    atk: atkLines, F, P, castAb, slots, dv, groups, skillSrc, spDetail, langs };
  renderAuto();
}

  s.fill = l => { s.replaceChildren(...l.map(x => (Array.isArray(x) ? optEl(x[0], x[1]) : optEl(x)))); const v = getCfg(path); s.value = v == null ? '' : v; };
  s.fill(list);
  s.addEventListener('change', () => { setCfg(path, s.value); if (after) after(); compute(); changed(); });
  cfgEls.push(s);

}
function cfgText(path, label, o = {}) {

// 技能選擇：把每個來源能選的技能列成按鈕
function renderChips() {
  const box = D.chips;
  box.replaceChildren();
  if (C.bg) box.append(h('p', { class: 'cgt' }, h('b', { text: `背景・${cfg.bg}（自動）` }),
    '：' + C.bg.skills.map(k => SKN[k]).join('、')));

  for (const g of C.groups) {
    const left = g.n - g.picked.length;
    box.append(h('p', { class: 'cgt' }, h('b', { text: g.title }),
      `：從下面選 ${g.n} 項`, h('span', { class: left ? 'need' : 'done', text: left ? `（還可選 ${left}）` : '（已選滿）' })));
    const row = h('div', { class: 'chips' });
    for (const k of g.pool) {
      const mine = g.picked.includes(k);
      const other = !mine && C.skillSrc[k];
      const b = h('button', { type: 'button', class: 'chip', 'aria-pressed': String(mine), text: SKN[k] + (other ? `・${other}` : '') });
      if (other) { b.disabled = true; b.title = `已由${other}提供`; }
      b.addEventListener('click', () => {
        const list = (cfg.picks[g.key] || []).filter(x => g.pool.includes(x) && x !== k);
        if (!mine) {
          if (g.picked.length >= g.n) { toast(`${g.title}最多選 ${g.n} 項，請先取消一項`); return; }
          list.push(k);
        }
        cfg.picks[g.key] = list;
        compute(); changed();
      });
      row.append(b);
    }
    box.append(row);
  }
}

    D['mod_' + k].textContent = has(k) ? fmt(mod[k]) : '—';
    D['score_' + k].textContent = has(k) ? `屬性值 ${score[k]}${bonus[k] ? `（背景 +${bonus[k]}）` : ''}` : '請填基礎值';
    D['sdot_' + k].setAttribute('aria-pressed', String(C.saveProf.has(k)));
    D['save_' + k].textContent = has(k) ? fmt(mod[k] + (C.saveProf.has(k) ? pb : 0)) : '—';
  }
  for (const [k, , a] of SKA) {
    const lv = C.skillLv[k];
    D['sk_' + k].setAttribute('aria-pressed', String(lv > 0));
    D['sk_' + k].dataset.s = lv;
    D['skv_' + k].textContent = has(a) ? fmt(C.skillVal[k]) : '—';
    const tags = [];
    if (C.skillSrc[k]) tags.push(C.skillSrc[k]);
    if (lv === 2) tags.push('專精');
    D['sktag_' + k].textContent = tags.join('・');
  }
  renderChips();
  D.skillHint.textContent = '下面每一項會自動算出加值，標籤是熟練的來源。點左邊圓圈可以另外加熟練或設定專精（例如遊蕩者、吟遊詩人的專精）。';
  D.ac.textContent = has('dex') ? C.ac : '—';
  D.init.textContent = has('dex') ? fmt(C.init) : '—';
  D.speed.textContent = `${C.speed} 尺`;
  D.pb.textContent = fmt(pb);
  D.passive.textContent = has('wis') ? 10 + C.skillVal.perception : '—';
  D.hpmax.textContent = C.hp ?? '—';
  D.hd.textContent = c ? `${C.lvl}d${c.hd}` : '—';
  D.shield.setAttribute('aria-pressed', String(!!cfg.shield));
  D.atk.textContent = C.atk.join('\n') || '（選擇武器後自動產生）';
  D.profs.textContent = C.P.join('\n');
  const spLang = sp && sp.lang;
  D.lang2auto.hidden = !spLang; D.lang2sel.hidden = !!spLang;
  D.lang2.textContent = spLang || '';
  D.spdetail.innerHTML = C.spDetail || '<p>（選擇物種後自動產生）</p>';
  D.spAblWrap.hidden = !(sp && sp.spells && !sp.spellAbl);
  D.features.textContent = C.F.join('\n') || '（選擇物種、背景、職業後自動產生）';
  D.scls.textContent = C.castAb ? c.name : '—';
  D.sabl.textContent = C.castAb ? ABN[C.castAb] : '—';
  D.sdc.textContent = C.castAb ? 8 + pb + mod[C.castAb] : '—';
  D.satk.textContent = C.castAb ? fmt(pb + mod[C.castAb]) : '—';
  const r = C.row;
  D.castHint.textContent = !c ? '' : !C.castAb ? `${c.name}沒有施法能力。` :
    [r.cantrips ? `可知戲法 ${r.cantrips} 個` : '', r.prepared ? `可準備法術 ${r.prepared} 個` : '',
      r.pact ? `契約法術位 ${r.pact} 個，全部為 ${r.pactLv} 環` : ''].filter(Boolean).join('・');
  for (let i = 1; i <= 9; i++) if (D['slot' + i]) D['slot' + i].textContent = C.slots[i - 1] || '—';
}

function syncForm() {
  if (!mirrors.charname) return;
  for (const [k, e] of Object.entries(mirrors)) {
    if (byKey[k].t === 'c') e.setAttribute('aria-pressed', els[k].getAttribute('aria-pressed'));
    else { e.value = els[k].value; if (e.tagName === 'TEXTAREA') grow(e); }
  }
  for (const e of cfgEls) {
    if (e === document.activeElement) continue;
    const v = getCfg(e.path);
    e.value = v == null ? '' : v;
    if (e.tagName === 'TEXTAREA') grow(e);
  }
  lvUpdaters.forEach(u => u());
  if (notesM !== document.activeElement) notesM.innerHTML = notes.innerHTML;
  renderAuto();
}

const wide = matchMedia('(min-width: 760px)');
function setView(v) {
  document.body.classList.toggle('view-form', v === 'form');
  $('#bView').textContent = v === 'form' ? '紙本預覽' : '表單模式';
  if (v === 'form') syncForm(); else { scale(); fitAll(); }
}
$('#bView').addEventListener('click', () => {
  setView(document.body.classList.contains('view-form') ? 'sheet' : 'form');
  window.scrollTo(0, 0);
});
const more = $('#more');
const syncMore = () => { more.open = wide.matches; };
wide.addEventListener('change', syncMore);
more.querySelector('.menu').addEventListener('click', e => {
  if (!wide.matches && e.target.closest('button')) more.open = false;
});
$('#fImport').addEventListener('change', () => { if (!wide.matches) more.open = false; });

// ---------- 啟動 ----------
build($('#page1'), FIELDS.p1);
build($('#page2'), FIELDS.p2);
for (const k of AUTO) {
  const e = els[k]; if (!e) continue;
  if (e.classList.contains('dot')) e.dataset.auto = '1';
  else { e.readOnly = true; e.classList.add('auto'); e.title = '自動計算：請在表單修改'; }
}
makeSpBox();
buildForm();
let saved = null;
try { saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch (e) {}
applyState(saved || defaults());
syncMore();
setView(matchMedia('(min-width: 1280px)').matches ? 'sheet' : 'form');   // 自動版以表單為主
addEventListener('resize', scale);
document.fonts && document.fonts.ready.then(() => { if (!document.body.classList.contains('view-form')) fitAll(); });
</script>
</body>
</html>
